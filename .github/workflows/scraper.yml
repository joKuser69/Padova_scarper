name: Monitoraggio annunci Padova

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # permette l'avvio manuale da GitHub (Actions -> Run workflow)

# Necessario per poter fare commit del file di stato aggiornato (storico prezzi/zona)
permissions:
  contents: write

concurrency:
  group: padova-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze Python
        run: pip install -r requirements.txt

      - name: Esegui il bot
        env:
          IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
          IMAP_APP_PASSWORD: ${{ secrets.IMAP_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPER_DEBUG: "1"
        run: python main.py

      - name: Carica debug (HTML/email) come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit dello stato aggiornato
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Padova Scraper Bot"
          git add data/state.json
          git diff --quiet --cached || git commit -m "Aggiorna stato annunci [skip ci]"
          git push
